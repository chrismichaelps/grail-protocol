[package]
name = "@chrismichaelps/grail-protocol"
version = "0.1.0"
description = "Grail: a graph-routed protocol for agents, tools, memory, and people to exchange information with causality, provenance, and scope isolation"
license = "Apache-2.0"
keywords = ["protocol", "agents", "graph", "provenance", "capabilities", "pudu"]
language = ">=0.1.3 <0.2.0"
source = "src"

[dependencies]
"@chrismichaelps/pudu-lang-environment" = "=0.1.0"
"@chrismichaelps/pudu-lang-httpclient" = "=0.1.1"
"@chrismichaelps/pudu-lang-log" = "=0.1.0"
"@chrismichaelps/pudu-lang-mcp" = "=0.1.2"
"@chrismichaelps/pudu-lang-mediator" = "=0.1.0"
"@chrismichaelps/pudu-lang-resilience" = "=0.1.0"
"@chrismichaelps/pudu-lang-validator" = "=0.1.1"
